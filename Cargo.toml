[package]
name = "datacraft"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/javy-fernandez/datacraft"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
# GPU: solo Metal + WGSL (sin Vulkan/GLES/DX12/WebGPU), que es lo único que usa macOS.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "persistence"] }
egui-wgpu = { version = "0.36", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
egui = "0.36"
egui_extras = "0.36"
futures-util = "0.3.34"
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.17.2"
# SQLite del sistema (/usr/lib/libsqlite3) en vez de compilarlo dentro del binario.
rusqlite = { version = "0.40.2", features = ["backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# TLS con rustls: el TLS nativo de macOS (Security.framework) no negocia con SQL Server.
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
# MySQL / MariaDB: pure Rust, rustls with the same aws-lc provider as tiberius.
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls"] }
# Oracle: ODPI-C, loads the Oracle Instant Client at runtime (not needed to build).
oracle = "0.6.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7.20", features = ["compat"] }
# Snowflake: its REST protocol over HTTPS (rustls on aws-lc, as elsewhere); aws-lc-rs also signs
# the key-pair JWT and pkcs8 decrypts passphrase-protected keys (`openssl pkcs8 -v2 des3`).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "query", "system-proxy"] }
aws-lc-rs = "1.18.2"
pkcs8 = { version = "0.10", features = ["encryption", "3des", "std"] }
base64 = "0.22.1"
uuid = { version = "1.28.0", features = ["v4"] }
# SSH tunnels to the database through a bastion (pure Rust, crypto on aws-lc like the rest).
russh = "0.65.0"
flate2 = "1.1.10"
muda = { version = "0.21.2", default-features = false }
sys-locale = "0.3.2"
# ClickHouse: protocolo nativo TCP (nativeclick, tenedero de klickhouse; sin derive ni serde: filas dinámicas).
# Versión fijada: el crate es joven. TLS (puerto 9440) con rustls y el verificador del sistema, los
# mismos que ya usa reqwest para Snowflake.
nativeclick = { version = "=0.26.9", default-features = false, features = ["compression", "tls"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.7"
# NoSQL: Redis / Valkey (async on tokio) and MongoDB's official driver (rustls).
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls-aws-lc", "dns-resolver"] }

# Keep the background scheduler's Keychain reads non-interactive.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# Windows: DirectX 12 for the GPU, the Credential Manager for passwords and a bundled SQLite
# (there is no system libsqlite3 to link against).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Linux: ventanas Wayland + X11, Vulkan para la GPU y el Secret Service (GNOME Keyring / KWallet)
# para las contraseñas. SQLite enlaza contra la libsqlite3 del sistema, como en macOS (necesita
# sqlite-devel). Nada de esto entra en las compilaciones de macOS ni de Windows.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
# Certificates for the TLS tests (a CA, server and client certificates made in the test).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[build-dependencies]
# Native Windows icon resources, including MSVC and cross-compiled GNU/ARM64 builds.
embed-resource = "3.0.12"
