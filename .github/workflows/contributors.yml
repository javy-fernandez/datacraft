name: Contributors chart

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/contributors/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  update:
    # Forks get the chart by syncing with the main repository.
    if: github.repository == 'javy-fernandez/datacraft'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/contributors.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md docs/contributors; then
            echo "Contributor chart is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/contributors
          git commit -m "Update contributor chart"
          git push
